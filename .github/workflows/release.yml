name: Release

# Fires only when a version tag is pushed. Tagging is a deliberate human act -
# CI never tags.
#
# Publishing uses npm trusted publishing: npm trusts THIS workflow file in THIS
# repo, in the `npm` environment, and accepts a short-lived token GitHub mints for
# the run. No npm token is stored anywhere. The trust was set up once with:
#   npm trust github indratrace --file release.yml \
#     --repo indrasol/indratrace-node-sdk --env npm --allow-publish
# (npm >= 12, run by a package owner). Renaming this file or the environment
# breaks publishing until the trust is updated to match.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm (trusted publishing)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # the short-lived OIDC token npm trusts, and the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; don't depend on what the runner's
      # Node happens to bundle.
      - run: npm install -g npm@11
      - run: npm --version

      # Guard: the tag must match package.json AND src/version.ts. npm version
      # numbers can never be reused, so a mismatched publish is unrecoverable.
      - name: Assert tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          src="$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/version.ts)"
          echo "tag=$tag package.json=$pkg version.ts=$src"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$src" ]; then
            echo "::error::tag v$tag does not match package.json $pkg / version.ts $src - refusing to publish"
            exit 1
          fi

      # A tag for a version that is already on npm (re-pushed, or published by
      # hand) is a no-op, not a failed release.
      - name: Skip if this version is already published
        id: exists
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "indratrace@$v" version >/dev/null 2>&1; then
            echo "::notice::indratrace@$v is already on npm - nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.published != 'true'
        run: npm ci
      - if: steps.exists.outputs.published != 'true'
        run: npm run typecheck
      - if: steps.exists.outputs.published != 'true'
        run: npm test
      - if: steps.exists.outputs.published != 'true'
        run: npm run smoke
      - if: steps.exists.outputs.published != 'true'
        run: npm publish --provenance --access public
